<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="1400" height="850" fill="#f7f9fb"/>
  <text x="700" y="55" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#15222b">ESP32-S3 N16R8 ↔ 0.96 英寸 SSD1306 OLED I²C 接线图</text>
  <text x="700" y="92" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#52636e">按照照片的右侧针脚阅读方式绘制，OLED 的 SCL/SDA 是 I²C 信号</text>

  <rect x="78" y="145" width="430" height="575" rx="24" fill="#1d2b35" stroke="#3b5968" stroke-width="6"/>
  <text x="293" y="190" text-anchor="middle" fill="#fff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700">ESP32-S3 N16R8</text>
  <text x="293" y="220" text-anchor="middle" fill="#a9d3e4" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16">天线朝上、USB 在下时使用的 GPIO</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" fill="#fff">
    <rect x="112" y="270" width="362" height="58" rx="8" fill="#3a4c58"/><text x="138" y="307">GND</text>
    <rect x="112" y="372" width="362" height="58" rx="8" fill="#3a4c58"/><text x="138" y="409">3V3</text>
    <rect x="112" y="474" width="362" height="58" rx="8" fill="#3a4c58"/><text x="138" y="511">GPIO12</text>
    <rect x="112" y="576" width="362" height="58" rx="8" fill="#3a4c58"/><text x="138" y="613">GPIO11</text>
  </g>

  <rect x="920" y="145" width="410" height="575" rx="24" fill="#0b5f8e" stroke="#2e8fb9" stroke-width="6"/>
  <text x="1125" y="190" text-anchor="middle" fill="#fff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700">0.96 英寸 OLED</text>
  <text x="1125" y="220" text-anchor="middle" fill="#d2f1ff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16">常见 SSD1306 I²C 模块针脚</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" fill="#fff">
    <rect x="952" y="270" width="346" height="58" rx="8" fill="#1b789f"/><text x="976" y="307">1  GND</text>
    <rect x="952" y="372" width="346" height="58" rx="8" fill="#1b789f"/><text x="976" y="409">2  VCC</text>
    <rect x="952" y="474" width="346" height="58" rx="8" fill="#1b789f"/><text x="976" y="511">3  SCL</text>
    <rect x="952" y="576" width="346" height="58" rx="8" fill="#1b789f"/><text x="976" y="613">4  SDA</text>
  </g>

  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M474 299 C640 299 760 299 952 299" stroke="#20252a"/>
    <path d="M474 401 C640 401 760 401 952 401" stroke="#e33131"/>
    <path d="M474 503 C640 503 760 503 952 503" stroke="#2a78ff"/>
    <path d="M474 605 C640 605 760 605 952 605" stroke="#24cba8"/>
  </g>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#34434c">
    <text x="712" y="280" text-anchor="middle">GND → GND</text>
    <text x="712" y="382" text-anchor="middle">3V3 → VCC</text>
    <text x="712" y="484" text-anchor="middle">GPIO12 → SCL</text>
    <text x="712" y="586" text-anchor="middle">GPIO11 → SDA</text>
  </g>

  <rect x="78" y="760" width="1252" height="58" rx="14" fill="#fff5d8" stroke="#e5b83c" stroke-width="3"/>
  <text x="103" y="796" fill="#6f5200" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">OLED 只接四根线，VCC 使用 3V3。不要把照片中 ST7789 的 RES、DC、CS、BLK 接到这块 I²C OLED。</text>
</svg>

